name: CI & Release

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - name: Enable Windows symlinks
        if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@v5
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        id: install
      - run: npm audit --include=dev
      - run: npm test
      - name: Test installed package
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:package
      - name: Upload package test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-test-${{ matrix.os }}-node-${{ matrix.node }}
          path: .artifacts/package-test/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Extract npm tag
        id: extract_tag
        shell: bash
        run: |
          VERSION_TAG="$GITHUB_REF_NAME"
          if [[ "$VERSION_TAG" == *"-"* ]]; then
            PRERELEASE_PART="${VERSION_TAG#*-}"
            NPM_TAG="${PRERELEASE_PART%%.*}"
          else
            NPM_TAG="latest"
          fi
          if [[ "$NPM_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          else
            echo "Invalid NPM_TAG value: '$NPM_TAG'"
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run prepare
      - run: npm publish --access public --tag "$NPM_TAG"
